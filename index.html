<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#073141">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Presupuesto">
<link rel="manifest" href="manifest.json">
<title>Presupuesto</title>
<style>
:root{--navy:#073141;--blue:#176b83;--bg:#f3f7f9;--card:#fff;--line:#dbe6ea;--muted:#6d8088;--shadow:0 12px 30px rgba(7,49,65,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#16333d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:22px}.hidden{display:none!important}
.hero{min-height:270px;border-radius:28px;background:linear-gradient(90deg,rgba(7,49,65,.82),rgba(7,49,65,.22)),linear-gradient(135deg,#0a5268,#8bb7c4);background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:30px;color:#fff;box-shadow:var(--shadow);margin-bottom:18px}
.hero h1{margin:0;font-size:44px;line-height:1}.hero p{margin:9px 0 0;opacity:.88}.hero-content{width:100%}
.layout{display:grid;grid-template-columns:1fr 330px;gap:18px}.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.panel h2{margin:0 0 15px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form-grid.three{grid-template-columns:repeat(3,1fr)}
label{display:block;font-size:12px;font-weight:800;color:#516a74;margin-bottom:6px}input,select{width:100%;padding:11px 12px;border:1px solid #ccdbe0;border-radius:11px;background:#fff;color:#18343e}input:focus,select:focus{outline:2px solid #b8dbe5;border-color:#7fb9c9}
.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:850;background:var(--navy);color:white}.btn.secondary{background:#edf3f5;color:var(--navy)}.btn.danger{background:#fff0f0;color:#a33030}.btn.small{padding:8px 10px;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.top-actions{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:16px}
.passengers{display:flex;flex-wrap:wrap;gap:7px}.passenger-chip{border:1px solid #ccdbe0;background:#fff;border-radius:999px;padding:8px 11px;display:flex;gap:7px;align-items:center}.passenger-chip.selected{background:#e3f1f5;border-color:#75aebe;color:var(--navy);font-weight:800}
.type-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.type-tab{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:12px;padding:10px 12px;font-weight:850}.type-tab.active{background:var(--navy);color:#fff}
.editor{background:#f7fafb;border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:14px}.editor h3{margin:0 0 13px}
.items{display:grid;gap:12px;margin-top:15px}.item{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 7px 20px rgba(7,49,65,.05);position:relative}.item.dragging{opacity:.45}.item.dragover{outline:2px dashed #74aebd}
.item-head{display:flex;justify-content:space-between;gap:15px}.item-title{font-size:20px;font-weight:900;margin:0 0 5px}.item-meta{color:var(--muted);font-size:13px}.price{font-weight:950;font-size:21px;text-align:right;white-space:nowrap}.per{font-size:12px;color:var(--muted);font-weight:750}
.item-photo{width:100%;max-height:230px;object-fit:cover;border-radius:14px;margin-bottom:14px}.hotel-photo{height:250px;object-fit:cover}
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.detail{background:#f4f8fa;border-radius:10px;padding:9px}.detail small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:850}.detail b{display:block;margin-top:3px}
.brand-row{display:flex;align-items:center;justify-content:flex-start;gap:18px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.brand-row img{width:auto;max-width:260px;max-height:90px;object-fit:contain}.transfer-brand img{max-width:210px;max-height:75px}
.stars{display:flex;flex-wrap:wrap;gap:6px}.star-option{border:1px solid var(--line);border-radius:10px;padding:8px;background:white}.star-option.selected{background:#e8f4f7;border-color:#69a8b8}
.summary{position:sticky;top:15px}.total{font-size:38px;font-weight:950;color:var(--navy)}.summary-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}.muted{color:var(--muted)}
.url-input{margin-top:7px}.file-url{display:grid;gap:7px}
.home{min-height:100vh;padding:25px}.home-card{max-width:850px;margin:auto}.budget-list{display:grid;gap:10px}.budget{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}.budget small{display:block;color:var(--muted);margin-top:4px}
.empty{text-align:center;padding:35px;color:var(--muted);border:1px dashed #b9ccd3;border-radius:16px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;border:0;border-radius:50%;width:56px;height:56px;background:var(--navy);color:#fff;font-size:22px;box-shadow:0 10px 25px rgba(0,0,0,.2)}
@media(max-width:800px){.wrap{padding:12px}.layout{grid-template-columns:1fr}.summary{position:static}.hero{min-height:205px;border-radius:20px;padding:22px}.hero h1{font-size:33px}.form-grid,.form-grid.three{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr 1fr}.item-head{align-items:flex-start}.brand-row img{max-width:170px;max-height:65px}.transfer-brand img{max-width:150px;max-height:58px}input,select,.btn{min-height:44px;font-size:16px}}
.print-only{display:none}
@media print{
  @page{size:A4;margin:3.5mm 4mm 6mm}
  html,body{background:#fff!important}
  body{color:#16333d}
  #app,#home,.fab{display:none!important}
  #printArea{display:block!important}
  .print-cover{height:20mm;border-radius:0 0 3mm 3mm;background:linear-gradient(100deg,#083a4b 0%,#176b83 55%,#4b9aaa 100%);position:relative;overflow:hidden;margin:-3.5mm -4mm 3.5mm;color:#fff;border:0}
  .print-cover::before{content:"";position:absolute;width:90mm;height:90mm;border-radius:50%;right:-35mm;top:-55mm;background:rgba(255,255,255,.10)}
  .print-cover::after{content:"✈  ·  ·  ·";position:absolute;right:7mm;top:5mm;font-size:11pt;letter-spacing:5px;color:rgba(255,255,255,.34);transform:rotate(-4deg)}
  .print-cover-content{position:absolute;z-index:1;left:6mm;top:3.5mm;right:8mm;display:flex;align-items:center;gap:8mm}
  .print-cover h1{font-size:16pt;line-height:1;margin:0;color:#fff;white-space:nowrap}
  .print-cover p{font-size:8.5pt;margin:0;color:rgba(255,255,255,.82);white-space:nowrap}
  .print-summary{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #dbe6ea;padding:0 0 2.5mm;margin-bottom:3mm}
  .print-summary h2{margin:0;font-size:15pt}
  .print-total{font-size:20pt;font-weight:950;color:#073141}
  .print-passengers{font-size:8.5pt;color:#6d8088;margin-top:1mm}
  .print-items{display:grid;gap:2mm}
  .print-card{border:1px solid #dbe6ea;border-radius:3.5mm;padding:2.4mm;break-inside:avoid;page-break-inside:avoid;background:#fff}
  .print-card.hotel{padding:0;overflow:hidden;display:grid;grid-template-columns:38mm 1fr;min-height:30mm}
  .print-card.hotel .print-card-body{padding:2.8mm 3.2mm}
  .print-hotel-photo{width:38mm;height:100%;min-height:30mm;object-fit:cover;object-position:center;display:block}
  .print-card-head{display:flex;justify-content:space-between;gap:5mm;align-items:flex-start}
  .print-title{font-size:15pt;font-weight:950;line-height:1.15}
  .print-subtitle{font-size:9.5pt;color:#6d8088;margin-top:1mm}
  .print-price{text-align:right;font-size:15pt;font-weight:950;white-space:nowrap}
  .print-per{font-size:8.5pt;color:#6d8088;font-weight:750;margin-top:1mm}
  .print-cover-date{font-size:8pt;font-weight:850;color:rgba(255,255,255,.92);margin:0 0 0 auto;letter-spacing:.2px;white-space:nowrap}
  .print-date{font-size:8.2pt;font-weight:850;color:#2d7e90;margin-top:1mm}
  .print-flight-row{display:grid;grid-template-columns:minmax(0,1fr) 30mm;gap:4mm;align-items:center;margin-top:1.5mm}
  .print-flight-details{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:2mm;margin-top:0}
  .print-flight-brand{min-height:20mm;border-left:1px solid #dbe6ea;padding-left:3mm;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1mm;text-align:center}
  .print-flight-brand img{max-width:28mm;max-height:14mm;object-fit:contain}
  .print-flight-brand b{font-size:8pt;color:#49636d}
  .print-detail{background:#f4f8fa;border-radius:2.5mm;padding:1.7mm}
  .print-detail small{display:block;color:#6d8088;font-size:7pt;font-weight:900;text-transform:uppercase}
  .print-detail b{display:block;margin-top:1mm;font-size:9.5pt}
  .print-brand{display:flex;justify-content:space-between;align-items:center;gap:8mm;border-top:1px solid #dbe6ea;margin-top:2mm;padding-top:2mm}
  .print-brand img{max-width:48mm;max-height:20mm;object-fit:contain}
  .print-transfer .print-brand img{max-width:40mm;max-height:15mm}
  .print-photo{width:100%;max-height:20mm;object-fit:cover;border-radius:2.5mm;margin-bottom:2.5mm}
  .print-footer{margin-top:4mm;text-align:center;font-size:7.5pt;color:#8a9ba1}
}

.logo-auto-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.logo-auto-row input{flex:1;min-width:160px}
.logo-preview{display:flex;align-items:center;gap:10px;margin-top:8px;min-height:42px}
.logo-preview img{width:54px;height:36px;object-fit:contain;border-radius:6px;background:#fff;border:1px solid #dbe6ea;padding:4px}
.logo-status{font-size:12px;color:#61757d}
.logo-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.logo-actions button{font-size:12px;padding:6px 9px}

.pexels-search-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.pexels-search-row input{flex:1;min-width:180px}
.pexels-results{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.pexels-photo-option{padding:0;border:1px solid #ddd;border-radius:10px;background:#fff;overflow:hidden;cursor:pointer;text-align:left}
.pexels-photo-option img{display:block;width:100%;height:80px;object-fit:cover}
.pexels-photo-option span{display:block;padding:4px 6px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:700px){.pexels-results{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media print{.pexels-hotel-search{display:none!important}}

</style>
</head>
<body>

<div id="printArea" class="print-only"></div>
<div id="home" class="home hidden">
  <div class="home-card">
    <div class="hero" style="min-height:230px;margin-bottom:18px">
      <div class="hero-content"><h1>Presupuesto</h1><p>Organiza tus próximos viajes.</p></div>
    </div>
    <div class="panel">
      <div class="top-actions"><h2 style="margin:0">Mis presupuestos</h2><button class="btn" onclick="newBudget()">＋ Nuevo presupuesto</button></div>
      <div id="budgetList" class="budget-list"></div>
    </div>
  </div>
</div>

<div id="app" class="wrap">
  <div id="hero" class="hero">
    <div class="hero-content">
      <h1 id="heroTitle">Nombra tu próximo viaje</h1>
      <p id="heroSubtitle">Presupuesto de viaje</p>
    </div>
  </div>

  <div class="layout">
    <main>
      <section class="panel">
        <div class="top-actions">
          <h2>Datos del viaje</h2>
          <button class="btn secondary screen-only" onclick="showHome()">‹ Presupuestos</button>
        </div>
        <div class="form-grid">
          <div><label>Nombre del viaje</label><input id="tripTitle" placeholder="Nombra tu próximo viaje"></div>
          <div><label>Subtítulo</label><input id="tripSubtitle" placeholder="Ej. Octubre 2026 · 7 noches"></div>
          <div><label>Fecha de inicio</label><input id="tripStartDate" type="date"></div>
          <div><label>Fecha de fin</label><input id="tripEndDate" type="date"></div>
          <div><label>Fecha del viaje</label><input id="tripDate" type="date"></div>
        </div>
        <div style="margin-top:12px" class="file-url">
          <label>📸 Foto para el encabezado</label>
          <input id="tripPhoto" type="file" accept="image/*">
          <input id="tripPhotoUrl" class="url-input" type="url" placeholder="O pega la dirección de la imagen (https://...)">
        </div>

        <h2 style="margin-top:25px">Pasajeros</h2>
        <div class="form-grid" style="grid-template-columns:1fr auto">
          <input id="passengerName" placeholder="Nombre del pasajero">
          <button class="btn" onclick="addPassenger()">Añadir</button>
        </div>
        <div id="passengerList" class="passengers" style="margin-top:10px"></div>

        <div class="editor">
          <h3>Añadir item</h3>
          <div class="type-tabs">
            <button class="type-tab active" data-type="Vuelos" onclick="setType('Vuelos')">✈️ Vuelos</button>
            <button class="type-tab" data-type="Hoteles" onclick="setType('Hoteles')">🏨 Hoteles</button>
            <button class="type-tab" data-type="Traslados" onclick="setType('Traslados')">🚐 Traslados</button>
            <button class="type-tab" data-type="Imprimir" onclick="setType('Imprimir')">🖨️ Imprimir</button>
          </div>

          <div id="flightFields">
            <div class="form-grid">
              <div><label>Origen</label><input id="flightOrigin" placeholder="Málaga (AGP)"></div>
              <div><label>Destino</label><input id="flightDestination" placeholder="Lanzarote (ACE)"></div>
              <div><label>Hora de salida</label><input id="flightDeparture" type="time"></div>
              <div><label>Hora de llegada</label><input id="flightArrival" type="time"></div>
              <div><label>Compañía</label><input id="flightCompany" placeholder="Ryanair">
<div class="logo-auto-row">
  <button type="button" onclick="setAutoLogo('flight')">✨ Logo automático</button>
  <button type="button" onclick="logoPreview('flight')">👁️ Ver logo</button>
</div>
<div class="logo-actions">
  <button type="button" onclick="findBrandfetchLogo(document.getElementById('flightCompany')?.value || (typeof hotelCompanyValue==='function' ? hotelCompanyValue() : ''), 'flight')">🔎 Logo Brandfetch</button>
</div>
<div id="flightLogoStatus" class="logo-status"></div>
<div id="flightLogoPreview" class="logo-preview"></div></div>
              <div class="file-url"><label>Logo de la compañía</label><input id="flightLogo" type="file" accept="image/*"><input id="flightLogoUrl" type="url" placeholder="O URL del logo">
<div id="flightLogoPreview" class="logo-preview"></div></div>
            </div>
          </div>

          <div id="hotelFields" class="hidden">
            <div class="form-grid">
              <div><label>Nombre de establecimiento</label><input id="hotelName" placeholder="Paradisus Salinas Lanzarote"></div>
              <div><label>Categoría</label><div id="hotelStars" class="stars"></div></div>
            </div>
            <div class="file-url" style="margin-top:12px"><label>Foto del hotel</label><input id="hotelPhoto" type="file" accept="image/*"><div class="pexels-hotel-search">
<div class="pexels-title">📷 Foto del hotel</div>
<div class="pexels-search-row">
<input id="hotelPexelsQuery" type="text" placeholder="Se utilizará automáticamente el nombre del establecimiento" readonly>
<button type="button" onclick="searchPexelsHotel()">Buscar fotos en Pexels</button>
</div>
<div id="hotelPexelsStatus" class="logo-status"></div>
<div id="hotelPexelsResults" class="pexels-results"></div>
<div class="pexels-attribution">Fotos proporcionadas por <a href="https://www.pexels.com" target="_blank" rel="noopener">Pexels</a></div>
</div><input id="hotelPhotoUrl" type="url" placeholder="O URL de la foto"></div>
          </div>

          <div id="transferFields" class="hidden">
            <div class="form-grid">
              <div><label>Origen</label><input id="transferOrigin" placeholder="Aeropuerto"></div>
              <div><label>Destino</label><input id="transferDestination" placeholder="Hotel"></div>
              <div><label>Compañía</label><input id="transferCompany" placeholder="Líneas Romero / Cicar">
<div class="logo-auto-row">
  <button type="button" onclick="setAutoLogo('transfer')">✨ Logo automático</button>
  <button type="button" onclick="logoPreview('transfer')">👁️ Ver logo</button>
</div>
<div class="logo-actions">
  <button type="button" onclick="findBrandfetchLogo(document.getElementById('transferCompany')?.value || (typeof hotelCompanyValue==='function' ? hotelCompanyValue() : ''), 'transfer')">🔎 Logo Brandfetch</button>
</div>
<div id="transferLogoStatus" class="logo-status"></div>
<div id="transferLogoPreview" class="logo-preview"></div></div>
              <div class="file-url"><label>Logo</label><input id="transferLogo" type="file" accept="image/*"><input id="transferLogoUrl" type="url" placeholder="O URL del logo"></div>
            </div>
          </div>

          <div id="printFields" class="hidden">
            <div><label>Texto / título opcional</label><input id="printTitle" placeholder="Ej. Condiciones, nota, excursión..."></div>
          </div>

          <div class="file-url" style="margin-top:12px">
            <label>📸 Foto del item (opcional)</label>
            <input id="itemPhoto" type="file" accept="image/*">
            <input id="itemPhotoUrl" type="url" placeholder="O pega la dirección de la imagen (https://...)">
          </div>

          <div class="form-grid" style="margin-top:12px">
            <div><label>Fecha del item</label><input id="itemDate" type="date"></div>
            <div><label>Precio total (€)</label><input id="itemPrice" type="number" min="0" step="0.01" placeholder="1000"></div>
            <div><label>Pasajeros que comparten este coste</label><div id="itemPassengers" class="passengers"></div></div>
          </div>
          <div class="actions" style="margin-top:13px">
            <button class="btn" onclick="addItem()">＋ Añadir item</button>
            <button class="btn secondary" onclick="clearItemForm()">Limpiar</button>
          </div>
        </div>

        <h2 style="margin-top:25px">Itinerario y presupuesto</h2>
        <div id="items" class="items"></div>
      </section>
    </main>

    <aside class="panel summary">
      <h2>Resumen</h2>
      <div class="muted">Total del viaje</div>
      <div id="grandTotal" class="total">0,00 €</div>
      <div id="summaryRows"></div>
      <div class="actions" style="margin-top:16px">
        <button class="btn" onclick="renderPrint();window.print()">🖨️ Generar PDF</button>
        <button class="btn secondary" onclick="saveBudget()">💾 Guardar</button>
      </div>
    </aside>
  </div>
</div>
<button class="fab" onclick="renderPrint();window.print()" aria-label="Generar PDF">🖨️</button>

<script>
const STORAGE_KEY='presupuesto-viaje-pwa-v10.1';
const LIST_KEY='presupuesto-viaje-list-v10.1';
let currentId=null, type='Vuelos', passengers=[], items=[], selectedStars=5, selectedItemPassengers=[], headerPhotoData=null;
let deferredInstall=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const eur=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(Number(n)||0);
function formatDateES(v){if(!v)return '';const [y,m,d]=v.split('-');return `${d}/${m}/${y}`}

function fileToDataURL(file){return new Promise((resolve,reject)=>{if(!file)return resolve(null);const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
async function imageValue(fileId,urlId){const f=$(fileId)?.files?.[0];if(f)return await fileToDataURL(f);return $(urlId)?.value?.trim()||null}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({currentId,passengers,items,title:$('tripTitle').value,subtitle:$('tripSubtitle').value,photo:headerPhotoData||$('tripPhotoUrl').value.trim(),tripDate:$('tripDate').value}))}catch(e){}}
function loadList(){try{return JSON.parse(localStorage.getItem(LIST_KEY)||'[]')}catch(e){return[]}}
function saveList(a){localStorage.setItem(LIST_KEY,JSON.stringify(a))}
function snapshot(){return {id:currentId||('b'+Date.now()),title:$('tripTitle').value.trim()||'Nuevo viaje',subtitle:$('tripSubtitle').value.trim(),passengers,items,photo:headerPhotoData||$('tripPhotoUrl').value.trim(),tripDate:$('tripDate').value,updated:new Date().toISOString()}}
function saveBudget(){if(!currentId)currentId='b'+Date.now();const s=snapshot(),a=loadList(),i=a.findIndex(x=>x.id===currentId);if(i>=0)a[i]=s;else a.unshift(s);saveList(a);persist();renderHome();alert('Presupuesto guardado');}
function newBudget(){currentId='b'+Date.now();passengers=[];items=[];headerPhotoData=null;clearAll();$('tripTitle').value='';$('tripSubtitle').value='';$('tripDate').value='';$('tripPhotoUrl').value='';setHeroPhoto(null);showEditor();render()}
function openBudget(id){const s=loadList().find(x=>x.id===id);if(!s)return;currentId=s.id;passengers=s.passengers||[];items=s.items||[];headerPhotoData=(s.photo||'').startsWith('data:')?s.photo:null;$('tripTitle').value=s.title||'';$('tripSubtitle').value=s.subtitle||'';$('tripDate').value=s.tripDate||'';$('tripPhotoUrl').value=(s.photo||'').startsWith('data:')?'':(s.photo||'');setHeroPhoto(s.photo||null);showEditor();render()}
function deleteBudget(id){if(!confirm('¿Eliminar este presupuesto?'))return;saveList(loadList().filter(x=>x.id!==id));renderHome()}
function showHome(){if(currentId)saveBudgetSilent();renderHome();$('home').classList.remove('hidden');$('app').classList.add('hidden')}
function showEditor(){$('home').classList.add('hidden');$('app').classList.remove('hidden')}

function logoSlug(name){
  const n=(name||"").trim().toLowerCase().replace(/\s+/g," ");
  return SIMPLE_ICON_ALIASES[n] || n.replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}
function autoLogoUrl(name){
  const slug=logoSlug(name);
  return slug ? `https://cdn.simpleicons.org/${encodeURIComponent(slug)}` : "";
}
function setAutoLogo(prefix){
  const company=$(prefix+"Company")?.value?.trim() || "";
  const url=autoLogoUrl(company);
  const urlEl=$(prefix+"LogoUrl");
  if(urlEl) urlEl.value=url;
  const preview=$(prefix+"LogoPreview");
  if(preview){
    preview.innerHTML = url ? `<img src="${esc(url)}" alt="Logo"><span class="logo-status">Logo automático: ${esc(company)}</span>` : "";
  }
}
function clearAutoLogo(prefix){
  const urlEl=$(prefix+"LogoUrl");
  if(urlEl) urlEl.value="";

  if(preview) preview.innerHTML="";
}
function logoPreview(prefix){

const BRANDFETCH_CLIENT_ID = "1idlKhSUIZeTbMpoWB-";

function brandfetchSearchUrl(name){
  return "https://api.brandfetch.io/v2/search/" + encodeURIComponent((name||"").trim()) + "?c=" + encodeURIComponent(BRANDFETCH_CLIENT_ID);
}
function brandfetchLogoUrl(domain){
  return "https://cdn.brandfetch.io/" + encodeURIComponent(domain) + "?c=" + encodeURIComponent(BRANDFETCH_CLIENT_ID);
}
async function findBrandfetchLogo(name, prefix){
  const company=(name||"").trim();
  const status=$(`${prefix}LogoStatus`);
  const preview=$(`${prefix}LogoPreview`);
  if(!company){
    if(status) status.textContent="Escribe una marca primero";
    return;
  }
  if(status) status.textContent="Buscando marca…";
  try{
    const res=await fetch(brandfetchSearchUrl(company), {headers:{Accept:"application/json"}});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data=await res.json();
    const result=Array.isArray(data) ? data[0] : (data.results?.[0] || data.data?.[0] || data);
    const domain=result?.domain || result?.url?.replace(/^https?:\/\//,"").split("/")[0];
    if(!domain) throw new Error("No se encontró dominio");
    const logo=brandfetchLogoUrl(domain);
    const urlEl=$(prefix+"LogoUrl");
    if(urlEl) urlEl.value=logo;
    if(preview) preview.innerHTML=`<img src="${esc(logo)}" alt="Logo"><span class="logo-status">✓ ${esc(result.name||company)} · ${esc(domain)}</span>`;
    if(status) status.textContent="Logo encontrado";
  }catch(err){
    if(status) status.textContent="No se encontró automáticamente. Puedes usar URL o archivo.";
    if(preview) preview.innerHTML="";
  }
}
function brandfetchPreview(prefix){
  const urlEl=$(prefix+"LogoUrl");
  const preview=$(prefix+"LogoPreview");
  const status=$(prefix+"LogoStatus");
  const url=urlEl?.value?.trim()||"";
  if(preview) preview.innerHTML=url?`<img src="${esc(url)}" alt="Logo"><span class="logo-status">Logo seleccionado</span>`:"";
  if(status) status.textContent=url?"Logo listo":"";
}

  if(typeof hotelCompanyValue==="function"){
    const v=hotelCompanyValue();
    if(v && String(v).trim()) return String(v).trim();
  }
  return "";
}

async function searchPexelsHotel(){
  const hotelName=getHotelNameForPexels();
  const qEl=document.getElementById("hotelPexelsQuery");
  const status=document.getElementById("hotelPexelsStatus");
  const grid=document.getElementById("hotelPexelsResults");
  if(qEl) qEl.value=hotelName;

  if(!hotelName){
    if(status) status.textContent="Escribe primero el nombre del establecimiento.";
    return;
  }

  if(location.protocol==="file:"){
    if(status) status.textContent="ℹ️ La búsqueda de Pexels necesita abrir la web desde GitHub Pages (Chrome bloquea esta API desde file://).";
    return;
  }

  if(status) status.textContent="Buscando fotos de "+hotelName+"…";
  if(grid) grid.innerHTML="";

  const searches=[
    hotelName,
    hotelName+" hotel"
  ];

  try{
    let photos=[];
    for(const query of searches){
      const url="https://api.pexels.com/v1/search?query="+encodeURIComponent(query)+
        "&per_page=8&orientation=landscape&locale=es-ES";
      const res=await fetch(url,{
        method:"GET",
        mode:"cors",
        cache:"no-store",
        headers:{
          "Authorization":PEXELS_API_KEY,
          "Accept":"application/json"
        }
      });
      if(!res.ok){
        let detail="";
        try{detail=await res.text();}catch(e){}
        throw new Error("Pexels HTTP "+res.status+(detail?" — "+detail.slice(0,120):""));
      }
      const data=await res.json();
      photos=data.photos||[];
      if(photos.length) break;
    }

    if(!photos.length){
      if(status) status.textContent="Pexels no ha encontrado fotos para «"+hotelName+"».";
      return;
    }

    if(status) status.textContent="Selecciona una foto:";

    photos.forEach(photo=>{
      const card=document.createElement("button");
      card.type="button";
      card.className="pexels-photo-option";

      const img=document.createElement("img");
      img.src=photo.src?.medium||photo.src?.large||"";
      img.alt=photo.alt||("Foto de "+hotelName);
      img.loading="lazy";

      const credit=document.createElement("span");
      credit.textContent=photo.photographer||"Pexels";

      card.appendChild(img);
      card.appendChild(credit);

      card.addEventListener("click",()=>{
        const url=photo.src?.large2x||photo.src?.large||photo.src?.original||photo.src?.medium;
        const urlEl=document.getElementById("hotelPhotoUrl")||document.getElementById("hotelImageUrl");
        if(urlEl){
          urlEl.value=url;
          urlEl.dispatchEvent(new Event("input",{bubbles:true}));
          urlEl.dispatchEvent(new Event("change",{bubbles:true}));
        }
        const preview=document.getElementById("hotelPhotoPreview")||document.getElementById("hotelImagePreview");
        if(preview){
          preview.innerHTML="";
          const selected=document.createElement("img");
          selected.src=url;
          selected.alt="Foto del hotel";
          preview.appendChild(selected);
        }
        const creditEl=document.getElementById("hotelPhotoCredit");
        if(creditEl) creditEl.value="Foto: "+(photo.photographer||"Pexels")+" · Pexels";
        if(status) status.textContent="✓ Foto seleccionada";
      });
      grid?.appendChild(card);
    });
  }catch(err){
    console.error("Pexels:",err);
    if(status) status.textContent="❌ "+(err.message||"No se pudo conectar con Pexels");
  }
}

function boot(){currentId=null;passengers=[];items=[];headerPhotoData=null;selectedItemPassengers=[];setType('Vuelos');render();renderHome()}
boot();
</script>
