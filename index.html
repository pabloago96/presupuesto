<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#073141">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Presupuesto">
<link rel="manifest" href="manifest.json">
<title>Presupuesto</title>
<style>
:root{--navy:#073141;--blue:#176b83;--bg:#f3f7f9;--card:#fff;--line:#dbe6ea;--muted:#6d8088;--shadow:0 12px 30px rgba(7,49,65,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#16333d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:22px}.hidden{display:none!important}
.hero{min-height:270px;border-radius:28px;background:linear-gradient(90deg,rgba(7,49,65,.82),rgba(7,49,65,.22)),linear-gradient(135deg,#0a5268,#8bb7c4);background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:30px;color:#fff;box-shadow:var(--shadow);margin-bottom:18px}
.hero h1{margin:0;font-size:44px;line-height:1}.hero p{margin:9px 0 0;opacity:.88}.hero-content{width:100%}
.layout{display:grid;grid-template-columns:1fr 330px;gap:18px}.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.panel h2{margin:0 0 15px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form-grid.three{grid-template-columns:repeat(3,1fr)}
label{display:block;font-size:12px;font-weight:800;color:#516a74;margin-bottom:6px}input,select{width:100%;padding:11px 12px;border:1px solid #ccdbe0;border-radius:11px;background:#fff;color:#18343e}input:focus,select:focus{outline:2px solid #b8dbe5;border-color:#7fb9c9}
.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:850;background:var(--navy);color:white}.btn.secondary{background:#edf3f5;color:var(--navy)}.btn.danger{background:#fff0f0;color:#a33030}.btn.small{padding:8px 10px;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.top-actions{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:16px}
.passengers{display:flex;flex-wrap:wrap;gap:7px}.passenger-chip{border:1px solid #ccdbe0;background:#fff;border-radius:999px;padding:8px 11px;display:flex;gap:7px;align-items:center}.passenger-chip.selected{background:#e3f1f5;border-color:#75aebe;color:var(--navy);font-weight:800}
.type-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.type-tab{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:12px;padding:10px 12px;font-weight:850}.type-tab.active{background:var(--navy);color:#fff}
.editor{background:#f7fafb;border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:14px}.editor h3{margin:0 0 13px}
.items{display:grid;gap:12px;margin-top:15px}.item{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 7px 20px rgba(7,49,65,.05);position:relative}.item.dragging{opacity:.45}.item.dragover{outline:2px dashed #74aebd}
.item-head{display:flex;justify-content:space-between;gap:15px}.item-title{font-size:20px;font-weight:900;margin:0 0 5px}.item-meta{color:var(--muted);font-size:13px}.price{font-weight:950;font-size:21px;text-align:right;white-space:nowrap}.per{font-size:12px;color:var(--muted);font-weight:750}
.item-photo{width:100%;max-height:230px;object-fit:cover;border-radius:14px;margin-bottom:14px}.hotel-photo{height:250px;object-fit:cover}
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.detail{background:#f4f8fa;border-radius:10px;padding:9px}.detail small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:850}.detail b{display:block;margin-top:3px}
.brand-row{display:flex;align-items:center;justify-content:flex-start;gap:18px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.brand-row img{width:auto;max-width:260px;max-height:90px;object-fit:contain}.transfer-brand img{max-width:210px;max-height:75px}
.stars{display:flex;flex-wrap:wrap;gap:6px}.star-option{border:1px solid var(--line);border-radius:10px;padding:8px;background:white}.star-option.selected{background:#e8f4f7;border-color:#69a8b8}
.summary{position:sticky;top:15px}.total{font-size:38px;font-weight:950;color:var(--navy)}.summary-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}.muted{color:var(--muted)}
.url-input{margin-top:7px}.file-url{display:grid;gap:7px}
.home{min-height:100vh;padding:25px}.home-card{max-width:850px;margin:auto}.budget-list{display:grid;gap:10px}.budget{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}.budget small{display:block;color:var(--muted);margin-top:4px}
.empty{text-align:center;padding:35px;color:var(--muted);border:1px dashed #b9ccd3;border-radius:16px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;border:0;border-radius:50%;width:56px;height:56px;background:var(--navy);color:#fff;font-size:22px;box-shadow:0 10px 25px rgba(0,0,0,.2)}
@media(max-width:800px){.wrap{padding:12px}.layout{grid-template-columns:1fr}.summary{position:static}.hero{min-height:205px;border-radius:20px;padding:22px}.hero h1{font-size:33px}.form-grid,.form-grid.three{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr 1fr}.item-head{align-items:flex-start}.brand-row img{max-width:170px;max-height:65px}.transfer-brand img{max-width:150px;max-height:58px}input,select,.btn{min-height:44px;font-size:16px}}
.print-only{display:none}
@media print{
  @page{size:A4;margin:14mm 13mm 16mm}
  html,body{background:#fff!important}
  body{color:#16333d}
  #app,#home,.fab{display:none!important}
  #printArea{display:block!important}
  .print-cover{height:78mm;border-radius:10mm;position:relative;overflow:hidden;margin-bottom:8mm;color:#fff;background:#0a5268}
  .print-cover-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .print-cover-overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,49,65,.88),rgba(7,49,65,.18));z-index:1}
  .print-cover-content{position:absolute;z-index:2;left:12mm;bottom:11mm;right:12mm}
  .print-cover h1{font-size:30pt;line-height:1.05;margin:0 0 4mm;color:#fff}
  .print-cover p{font-size:12pt;margin:0;color:#eef7f9}
  .print-summary{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #dbe6ea;padding:0 1mm 5mm;margin-bottom:7mm}
  .print-summary h2{margin:0;font-size:17pt}
  .print-total{font-size:23pt;font-weight:950;color:#073141}
  .print-passengers{font-size:9pt;color:#6d8088;margin-top:2mm}
  .print-items{display:grid;gap:5mm}
  .print-card{border:1px solid #dbe6ea;border-radius:5mm;padding:5mm;break-inside:avoid;page-break-inside:avoid;background:#fff}
  .print-card.hotel{padding:0;overflow:hidden}
  .print-card.hotel .print-card-body{padding:5mm}
  .print-hotel-photo{width:100%;height:62mm;object-fit:cover;display:block}
  .print-card-head{display:flex;justify-content:space-between;gap:8mm;align-items:flex-start}
  .print-title{font-size:15pt;font-weight:950;line-height:1.15}
  .print-subtitle{font-size:9.5pt;color:#6d8088;margin-top:1.5mm}
  .print-price{text-align:right;font-size:15pt;font-weight:950;white-space:nowrap}
  .print-per{font-size:8.5pt;color:#6d8088;font-weight:750;margin-top:1mm}
  .print-flight-details{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:3mm;margin-top:4mm}
  .print-detail{background:#f4f8fa;border-radius:3mm;padding:3mm}
  .print-detail small{display:block;color:#6d8088;font-size:7pt;font-weight:900;text-transform:uppercase}
  .print-detail b{display:block;margin-top:1mm;font-size:9.5pt}
  .print-brand{display:flex;justify-content:space-between;align-items:center;gap:8mm;border-top:1px solid #dbe6ea;margin-top:4mm;padding-top:4mm}
  .print-brand img{max-width:48mm;max-height:20mm;object-fit:contain}
  .print-transfer .print-brand img{max-width:40mm;max-height:15mm}
  .print-photo{width:100%;max-height:55mm;object-fit:cover;border-radius:3mm;margin-bottom:4mm}
  .print-footer{margin-top:7mm;text-align:center;font-size:8pt;color:#8a9ba1}
}
</style>
</head>
<body>

<div id="printArea" class="print-only"></div>
<div id="home" class="home hidden">
  <div class="home-card">
    <div class="hero" style="min-height:230px;margin-bottom:18px">
      <div class="hero-content"><h1>Presupuesto</h1><p>Organiza tus próximos viajes.</p></div>
    </div>
    <div class="panel">
      <div class="top-actions"><h2 style="margin:0">Mis presupuestos</h2><button class="btn" onclick="newBudget()">＋ Nuevo presupuesto</button></div>
      <div id="budgetList" class="budget-list"></div>
    </div>
  </div>
</div>

<div id="app" class="wrap">
  <div id="hero" class="hero">
    <div class="hero-content">
      <h1 id="heroTitle">Nombra tu próximo viaje</h1>
      <p id="heroSubtitle">Presupuesto de viaje</p>
    </div>
  </div>

  <div class="layout">
    <main>
      <section class="panel">
        <div class="top-actions">
          <h2>Datos del viaje</h2>
          <button class="btn secondary screen-only" onclick="showHome()">‹ Presupuestos</button>
        </div>
        <div class="form-grid">
          <div><label>Nombre del viaje</label><input id="tripTitle" placeholder="Nombra tu próximo viaje"></div>
          <div><label>Subtítulo</label><input id="tripSubtitle" placeholder="Ej. Octubre 2026 · 7 noches"></div>
        </div>
        <div style="margin-top:12px" class="file-url">
          <label>📸 Foto para el encabezado</label>
          <input id="tripPhoto" type="file" accept="image/*">
          <input id="tripPhotoUrl" class="url-input" type="url" placeholder="O pega la dirección de la imagen (https://...)">
        </div>

        <h2 style="margin-top:25px">Pasajeros</h2>
        <div class="form-grid" style="grid-template-columns:1fr auto">
          <input id="passengerName" placeholder="Nombre del pasajero">
          <button class="btn" onclick="addPassenger()">Añadir</button>
        </div>
        <div id="passengerList" class="passengers" style="margin-top:10px"></div>

        <div class="editor">
          <h3>Añadir item</h3>
          <div class="type-tabs">
            <button class="type-tab active" data-type="Vuelos" onclick="setType('Vuelos')">✈️ Vuelos</button>
            <button class="type-tab" data-type="Hoteles" onclick="setType('Hoteles')">🏨 Hoteles</button>
            <button class="type-tab" data-type="Traslados" onclick="setType('Traslados')">🚐 Traslados</button>
            <button class="type-tab" data-type="Imprimir" onclick="setType('Imprimir')">🖨️ Imprimir</button>
          </div>

          <div id="flightFields">
            <div class="form-grid">
              <div><label>Origen</label><input id="flightOrigin" placeholder="Málaga (AGP)"></div>
              <div><label>Destino</label><input id="flightDestination" placeholder="Lanzarote (ACE)"></div>
              <div><label>Hora de salida</label><input id="flightDeparture" type="time"></div>
              <div><label>Hora de llegada</label><input id="flightArrival" type="time"></div>
              <div><label>Compañía</label><input id="flightCompany" placeholder="Ryanair"></div>
              <div class="file-url"><label>Logo de la compañía</label><input id="flightLogo" type="file" accept="image/*"><input id="flightLogoUrl" type="url" placeholder="O URL del logo"></div>
            </div>
          </div>

          <div id="hotelFields" class="hidden">
            <div class="form-grid">
              <div><label>Nombre de establecimiento</label><input id="hotelName" placeholder="Paradisus Salinas Lanzarote"></div>
              <div><label>Categoría</label><div id="hotelStars" class="stars"></div></div>
            </div>
            <div class="file-url" style="margin-top:12px"><label>Foto del hotel</label><input id="hotelPhoto" type="file" accept="image/*"><input id="hotelPhotoUrl" type="url" placeholder="O URL de la foto"></div>
          </div>

          <div id="transferFields" class="hidden">
            <div class="form-grid">
              <div><label>Origen</label><input id="transferOrigin" placeholder="Aeropuerto"></div>
              <div><label>Destino</label><input id="transferDestination" placeholder="Hotel"></div>
              <div><label>Compañía</label><input id="transferCompany" placeholder="Líneas Romero / Cicar"></div>
              <div class="file-url"><label>Logo</label><input id="transferLogo" type="file" accept="image/*"><input id="transferLogoUrl" type="url" placeholder="O URL del logo"></div>
            </div>
          </div>

          <div id="printFields" class="hidden">
            <div><label>Texto / título opcional</label><input id="printTitle" placeholder="Ej. Condiciones, nota, excursión..."></div>
          </div>

          <div class="file-url" style="margin-top:12px">
            <label>📸 Foto del item (opcional)</label>
            <input id="itemPhoto" type="file" accept="image/*">
            <input id="itemPhotoUrl" type="url" placeholder="O pega la dirección de la imagen (https://...)">
          </div>

          <div class="form-grid" style="margin-top:12px">
            <div><label>Precio total (€)</label><input id="itemPrice" type="number" min="0" step="0.01" placeholder="1000"></div>
            <div><label>Pasajeros que comparten este coste</label><div id="itemPassengers" class="passengers"></div></div>
          </div>
          <div class="actions" style="margin-top:13px">
            <button class="btn" onclick="addItem()">＋ Añadir item</button>
            <button class="btn secondary" onclick="clearItemForm()">Limpiar</button>
          </div>
        </div>

        <h2 style="margin-top:25px">Itinerario y presupuesto</h2>
        <div id="items" class="items"></div>
      </section>
    </main>

    <aside class="panel summary">
      <h2>Resumen</h2>
      <div class="muted">Total del viaje</div>
      <div id="grandTotal" class="total">0,00 €</div>
      <div id="summaryRows"></div>
      <div class="actions" style="margin-top:16px">
        <button class="btn" onclick="renderPrint();window.print()">🖨️ Generar PDF</button>
        <button class="btn secondary" onclick="saveBudget()">💾 Guardar</button>
      </div>
    </aside>
  </div>
</div>
<button class="fab" onclick="renderPrint();window.print()" aria-label="Generar PDF">🖨️</button>

<script>
const STORAGE_KEY='presupuesto-viaje-pwa-v10.1';
const LIST_KEY='presupuesto-viaje-list-v10.1';
let currentId=null, type='Vuelos', passengers=[], items=[], selectedStars=5, selectedItemPassengers=[], headerPhotoData=null;
let deferredInstall=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const eur=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(Number(n)||0);

function fileToDataURL(file){return new Promise((resolve,reject)=>{if(!file)return resolve(null);const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
async function imageValue(fileId,urlId){const f=$(fileId)?.files?.[0];if(f)return await fileToDataURL(f);return $(urlId)?.value?.trim()||null}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({currentId,passengers,items,title:$('tripTitle').value,subtitle:$('tripSubtitle').value,photo:headerPhotoData||$('tripPhotoUrl').value.trim()}))}catch(e){}}
function loadList(){try{return JSON.parse(localStorage.getItem(LIST_KEY)||'[]')}catch(e){return[]}}
function saveList(a){localStorage.setItem(LIST_KEY,JSON.stringify(a))}
function snapshot(){return {id:currentId||('b'+Date.now()),title:$('tripTitle').value.trim()||'Nuevo viaje',subtitle:$('tripSubtitle').value.trim(),passengers,items,photo:headerPhotoData||$('tripPhotoUrl').value.trim(),updated:new Date().toISOString()}}
function saveBudget(){if(!currentId)currentId='b'+Date.now();const s=snapshot(),a=loadList(),i=a.findIndex(x=>x.id===currentId);if(i>=0)a[i]=s;else a.unshift(s);saveList(a);persist();renderHome();alert('Presupuesto guardado');}
function newBudget(){currentId='b'+Date.now();passengers=[];items=[];headerPhotoData=null;clearAll();$('tripTitle').value='';$('tripSubtitle').value='';$('tripPhotoUrl').value='';setHeroPhoto(null);showEditor();render()}
function openBudget(id){const s=loadList().find(x=>x.id===id);if(!s)return;currentId=s.id;passengers=s.passengers||[];items=s.items||[];headerPhotoData=(s.photo||'').startsWith('data:')?s.photo:null;$('tripTitle').value=s.title||'';$('tripSubtitle').value=s.subtitle||'';$('tripPhotoUrl').value=(s.photo||'').startsWith('data:')?'':(s.photo||'');setHeroPhoto(s.photo||null);showEditor();render()}
function deleteBudget(id){if(!confirm('¿Eliminar este presupuesto?'))return;saveList(loadList().filter(x=>x.id!==id));renderHome()}
function showHome(){if(currentId)saveBudgetSilent();renderHome();$('home').classList.remove('hidden');$('app').classList.add('hidden')}
function showEditor(){$('home').classList.add('hidden');$('app').classList.remove('hidden')}
function saveBudgetSilent(){if(!currentId)currentId='b'+Date.now();const s=snapshot(),a=loadList(),i=a.findIndex(x=>x.id===currentId);if(i>=0)a[i]=s;else a.unshift(s);saveList(a);persist()}
function renderHome(){const box=$('budgetList'),a=loadList();if(!a.length){box.innerHTML='<div class="empty">No tienes presupuestos guardados todavía.<br><br>Pulsa «Nuevo presupuesto» para empezar.</div>';return}box.innerHTML=a.map(x=>`<div class="budget"><div><b>${esc(x.title)}</b><small>${x.items?.length||0} items · ${x.updated?new Date(x.updated).toLocaleDateString('es-ES'):''}</small></div><div class="actions"><button class="btn small" onclick="openBudget('${x.id}')">Abrir</button><button class="btn small danger" onclick="deleteBudget('${x.id}')">×</button></div></div>`).join('')}
function setHeroPhoto(src){$('hero').style.backgroundImage=src?`linear-gradient(90deg,rgba(7,49,65,.82),rgba(7,49,65,.22)),url("${src}")`:'linear-gradient(90deg,rgba(7,49,65,.82),rgba(7,49,65,.22)),linear-gradient(135deg,#0a5268,#8bb7c4)'}
function updateHero(){ $('heroTitle').textContent=$('tripTitle').value.trim()||'Nombra tu próximo viaje';$('heroSubtitle').textContent=$('tripSubtitle').value.trim()||'Presupuesto de viaje';if($('tripPhotoUrl').value.trim())setHeroPhoto($('tripPhotoUrl').value.trim())}
function addPassenger(){const n=$('passengerName').value.trim();if(!n)return;if(!passengers.includes(n))passengers.push(n);$('passengerName').value='';selectedItemPassengers=[...passengers];render();persist()}
function toggleItemPassenger(n){selectedItemPassengers=selectedItemPassengers.includes(n)?selectedItemPassengers.filter(x=>x!==n):[...selectedItemPassengers,n];renderItemPassengers()}
function renderPassengers(){ $('passengerList').innerHTML=passengers.length?passengers.map(n=>`<button class="passenger-chip" onclick="removePassenger('${esc(n)}')">${esc(n)} ×</button>`).join(''):'<span class="muted">Añade pasajeros para poder repartir los costes.</span>'}
function removePassenger(n){passengers=passengers.filter(x=>x!==n);selectedItemPassengers=selectedItemPassengers.filter(x=>x!==n);render();persist()}
function renderItemPassengers(){$('itemPassengers').innerHTML=passengers.length?passengers.map(n=>`<button type="button" class="passenger-chip ${selectedItemPassengers.includes(n)?'selected':''}" onclick="toggleItemPassenger('${esc(n)}')">${esc(n)}</button>`).join(''):'<span class="muted">Añade pasajeros arriba.</span>'}
function setType(t){type=t;document.querySelectorAll('.type-tab').forEach(b=>b.classList.toggle('active',b.dataset.type===t));$('flightFields').classList.toggle('hidden',t!=='Vuelos');$('hotelFields').classList.toggle('hidden',t!=='Hoteles');$('transferFields').classList.toggle('hidden',t!=='Traslados');$('printFields').classList.toggle('hidden',t!=='Imprimir')}
function renderStars(){$('hotelStars').innerHTML=['1','2','3','4','5','5 Gran Lujo','5 Lujo'].map(s=>`<button type="button" class="star-option ${selectedStars===s?'selected':''}" onclick="selectedStars='${s}';renderStars()">${s.includes(' ')?'5 🌟 '+s.split(' ')[1]+' Lujo':s+' 🌟'}</button>`).join('')}
async function addItem(){
  const price=Number($('itemPrice').value);if(!Number.isFinite(price)||price<0){alert('Introduce un precio válido.');return}
  if(!selectedItemPassengers.length){alert('Selecciona al menos un pasajero para este item.');return}
  const item={type,price,passengers:[...selectedItemPassengers],photo:null,logo:null,created:Date.now()};
  if(type==='Vuelos'){item.origin=$('flightOrigin').value.trim();item.destination=$('flightDestination').value.trim();item.departure=$('flightDeparture').value;item.arrival=$('flightArrival').value;item.company=$('flightCompany').value.trim();item.logo=await imageValue('flightLogo','flightLogoUrl')}
  if(type==='Hoteles'){item.name=$('hotelName').value.trim();item.stars=selectedStars;item.photo=await imageValue('hotelPhoto','hotelPhotoUrl')}
  if(type==='Traslados'){item.origin=$('transferOrigin').value.trim();item.destination=$('transferDestination').value.trim();item.company=$('transferCompany').value.trim();item.logo=await imageValue('transferLogo','transferLogoUrl')}
  if(type==='Imprimir'){item.title=$('printTitle').value.trim()}
  if(!item.photo)item.photo=await imageValue('itemPhoto','itemPhotoUrl')
  items.push(item);clearItemForm();render();persist()
}
function clearItemForm(){['itemPrice','flightOrigin','flightDestination','flightDeparture','flightArrival','flightCompany','flightLogoUrl','hotelName','hotelPhotoUrl','transferOrigin','transferDestination','transferCompany','transferLogoUrl','printTitle','itemPhotoUrl'].forEach(id=>{if($(id))$(id).value=''});['flightLogo','hotelPhoto','transferLogo','itemPhoto'].forEach(id=>{if($(id))$(id).value=''});selectedItemPassengers=[...passengers];selectedStars=5;renderStars();renderItemPassengers()}
function clearAll(){clearItemForm();headerPhotoData=null;['tripPhoto'].forEach(id=>{if($(id))$(id).value=''})}
function moveItem(i,dir){const j=i+dir;if(j<0||j>=items.length)return;[items[i],items[j]]=[items[j],items[i]];render();persist();setTimeout(()=>{const el=document.querySelector(`.item[data-index="${j}"]`);if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'})},0)}
function removeItem(i){items.splice(i,1);render();persist()}
function render(){
  updateHero();renderPassengers();renderItemPassengers();renderStars();renderItems();renderSummary();renderPrint()
}
function renderItems(){
 const box=$('items');if(!items.length){box.innerHTML='<div class="empty">Todavía no hay items. Añade tu primer vuelo, hotel, traslado o bloque de impresión.</div>';return}
 box.innerHTML=items.map((x,i)=>{
  const per=x.passengers.length?x.price/x.passengers.length:0;
  let body='';
  if(x.type==='Vuelos') body=`<div class="item-head"><div><div class="item-title">✈️ ${esc(x.origin||'Origen')} → ${esc(x.destination||'Destino')}</div><div class="item-meta">${esc(x.company||'Sin compañía')}</div></div><div class="price">${eur(x.price)}<div class="per">${eur(per)} / pasajero</div></div></div><div class="detail-grid"><div class="detail"><small>Origen</small><b>${esc(x.origin||'—')}</b></div><div class="detail"><small>Destino</small><b>${esc(x.destination||'—')}</b></div><div class="detail"><small>Horario</small><b>${esc(x.departure||'—')} → ${esc(x.arrival||'—')}</b></div></div>${x.logo?`<div class="brand-row"><b>${esc(x.company||'')}</b><img src="${esc(x.logo)}" alt="Logo"></div>`:''}`;
  else if(x.type==='Hoteles') body=`${x.photo?`<img class="item-photo hotel-photo" src="${esc(x.photo)}" alt="Hotel">`:''}<div class="item-head"><div><div class="item-title">🏨 ${esc(x.name||'Hotel')}</div><div class="item-meta">${esc(x.stars||'5')} 🌟</div></div><div class="price">${eur(x.price)}<div class="per">${eur(per)} / pasajero</div></div></div>`;
  else if(x.type==='Traslados') body=`<div class="item-head"><div><div class="item-title">🚐 ${esc(x.origin||'Origen')} → ${esc(x.destination||'Destino')}</div><div class="item-meta">${esc(x.company||'Sin compañía')}</div></div><div class="price">${eur(x.price)}<div class="per">${eur(per)} / pasajero</div></div></div>${x.logo?`<div class="brand-row transfer-brand"><b>${esc(x.company||'')}</b><img src="${esc(x.logo)}" alt="Logo"></div>`:''}`;
  else body=`<div class="item-head"><div><div class="item-title">🖨️ ${esc(x.title||'Imprimir')}</div><div class="item-meta">Bloque para impresión</div></div><div class="price">${eur(x.price)}<div class="per">${eur(per)} / pasajero</div></div></div>`;
  return `<article class="item" draggable="true" data-index="${i}">${x.photo&&x.type!=='Hoteles'?`<img class="item-photo" src="${esc(x.photo)}" alt="Foto">`:''}${body}<div class="item-meta" style="margin-top:12px">Pasajeros: ${x.passengers.map(esc).join(', ')}</div><div class="actions screen-only" style="margin-top:12px"><button class="btn small" onclick="moveItem(${i},-1)" ${i===0?'disabled':''}>↑ Subir</button><button class="btn small" onclick="moveItem(${i},1)" ${i===items.length-1?'disabled':''}>↓ Bajar</button><button class="btn small danger remove" onclick="removeItem(${i})">Eliminar</button></div></article>`
 }).join('');
 enableDrag()
}
function renderSummary(){const total=items.reduce((s,x)=>s+Number(x.price||0),0);$('grandTotal').textContent=eur(total);$('summaryRows').innerHTML=passengers.map(p=>{const t=items.filter(x=>x.passengers.includes(p)).reduce((s,x)=>s+x.price/x.passengers.length,0);return `<div class="summary-row"><span>${esc(p)}</span><b>${eur(t)}</b></div>`}).join('')}
function enableDrag(){
 const box=$('items');let dragged=null;
 box.querySelectorAll('.item').forEach(el=>{
  el.addEventListener('dragstart',()=>{dragged=el;el.classList.add('dragging')});
  el.addEventListener('dragend',()=>{if(dragged)dragged.classList.remove('dragging');syncOrder()});
  el.addEventListener('dragover',e=>{e.preventDefault();if(!dragged||dragged===el)return;const r=el.getBoundingClientRect();if(e.clientY>r.top+r.height/2)el.after(dragged);else el.before(dragged)})
 })
}
function syncOrder(){const ids=[...$('items').querySelectorAll('.item')].map(x=>Number(x.dataset.index));items=ids.map(i=>items[i]);render();persist()}
$('tripTitle').addEventListener('input',()=>{updateHero();persist()});$('tripSubtitle').addEventListener('input',()=>{updateHero();persist()});$('tripPhotoUrl').addEventListener('input',()=>{headerPhotoData=null;updateHero();persist();renderPrint()});$('tripPhoto').addEventListener('change',async()=>{const v=await fileToDataURL($('tripPhoto').files[0]);if(v){headerPhotoData=v;setHeroPhoto(v);persist();renderPrint()}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e});
async function installPWA(){if(!deferredInstall){alert('En iPhone: Safari → Compartir → Añadir a pantalla de inicio.');return}deferredInstall.prompt();deferredInstall=null}

function renderPrint(){
  const area=$('printArea');
  const total=items.reduce((sum,x)=>sum+Number(x.price||0),0);
  const title=$('tripTitle').value.trim()||'Nombra tu próximo viaje';
  const subtitle=$('tripSubtitle').value.trim()||'Presupuesto de viaje';
  const photo=headerPhotoData||$('tripPhotoUrl').value.trim();
  const coverPhoto=photo ? `<img class="print-cover-photo" src="${esc(photo)}" alt="">` : '';
  const passengerLine=passengers.length ? passengers.join(' · ') : 'Sin pasajeros';
  let cards=items.map(x=>{
    const per=x.passengers.length?x.price/x.passengers.length:0;
    const who=x.passengers.join(', ');
    if(x.type==='Vuelos'){
      return `<article class="print-card">
        ${x.photo?`<img class="print-photo" src="${esc(x.photo)}" alt="">`:''}
        <div class="print-card-head">
          <div><div class="print-title">✈️ ${esc(x.origin||'Origen')} → ${esc(x.destination||'Destino')}</div>
          <div class="print-subtitle">${esc(x.company||'Sin compañía')}</div></div>
          <div class="print-price">${eur(x.price)}<div class="print-per">${eur(per)} / pasajero</div></div>
        </div>
        <div class="print-flight-details">
          <div class="print-detail"><small>Origen</small><b>${esc(x.origin||'—')}</b></div>
          <div class="print-detail"><small>Destino</small><b>${esc(x.destination||'—')}</b></div>
          <div class="print-detail"><small>Horario</small><b>${esc(x.departure||'—')} → ${esc(x.arrival||'—')}</b></div>
        </div>
        ${x.logo?`<div class="print-brand"><b>${esc(x.company||'')}</b><img src="${esc(x.logo)}" alt="Logo"></div>`:''}
        <div class="print-subtitle" style="margin-top:3mm">Pasajeros: ${esc(who)}</div>
      </article>`;
    }
    if(x.type==='Hoteles'){
      return `<article class="print-card hotel">
        ${x.photo?`<img class="print-hotel-photo" src="${esc(x.photo)}" alt="">`:''}
        <div class="print-card-body"><div class="print-card-head">
          <div><div class="print-title">🏨 ${esc(x.name||'Hotel')}</div><div class="print-subtitle">${esc(x.stars||'5')} 🌟</div></div>
          <div class="print-price">${eur(x.price)}<div class="print-per">${eur(per)} / pasajero</div></div>
        </div>
        <div class="print-subtitle" style="margin-top:3mm">Pasajeros: ${esc(who)}</div></div>
      </article>`;
    }
    if(x.type==='Traslados'){
      return `<article class="print-card print-transfer">
        ${x.photo?`<img class="print-photo" src="${esc(x.photo)}" alt="">`:''}
        <div class="print-card-head"><div><div class="print-title">🚐 ${esc(x.origin||'Origen')} → ${esc(x.destination||'Destino')}</div>
        <div class="print-subtitle">${esc(x.company||'Sin compañía')}</div></div>
        <div class="print-price">${eur(x.price)}<div class="print-per">${eur(per)} / pasajero</div></div></div>
        ${x.logo?`<div class="print-brand"><b>${esc(x.company||'')}</b><img src="${esc(x.logo)}" alt="Logo"></div>`:''}
        <div class="print-subtitle" style="margin-top:3mm">Pasajeros: ${esc(who)}</div>
      </article>`;
    }
    return `<article class="print-card"><div class="print-card-head"><div><div class="print-title">🖨️ ${esc(x.title||'Imprimir')}</div></div>
      <div class="print-price">${eur(x.price)}<div class="print-per">${eur(per)} / pasajero</div></div></div>
      <div class="print-subtitle" style="margin-top:3mm">Pasajeros: ${esc(who)}</div></article>`;
  }).join('');
  area.innerHTML=`<section class="print-cover">${coverPhoto}<div class="print-cover-overlay"></div>
    <div class="print-cover-content"><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div>
  </section>
  <div class="print-summary"><div><h2>Resumen del viaje</h2><div class="print-passengers">${esc(passengerLine)}</div></div><div class="print-total">${eur(total)}</div></div>
  <section class="print-items">${cards || '<div class="print-card">No hay items añadidos.</div>'}</section>
  <div class="print-footer">Presupuesto · ${new Date().toLocaleDateString('es-ES')}</div>`;
}
function boot(){currentId=null;passengers=[];items=[];headerPhotoData=null;selectedItemPassengers=[];setType('Vuelos');render();renderHome()}
boot();
</script>
</body>
</html>
